<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>porpose-map</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet"href="root.css">
<header>
    <h1>新発田観光マップ</h1>
</header>

<!-- ジャンルフィルター -->
<div id="categories">
    <button class="category-btn active" data-category="all">すべて</button>
    <button class="category-btn" data-category="観光">🏯 観光</button>
    <button class="category-btn" data-category="グルメ">🍴 グルメ</button>
    <button class="category-btn" data-category="交通">🚉 交通</button>
    <button class="category-btn" data-category="公共施設">🏛 公共施設</button>
</div>

<!-- 情報表示 -->
<div id="info">
    地図上のピンをタップしてください。
</div>

<!-- 地図 -->
<div id="map"></div>

<!-- 現在地ボタン -->
<button id="locationButton">
    ◎
</button>
<button id="compassButton">
    🧭
</button>

<!-- Leaflet -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script src="root.js"></script>
